name: sfms
description: "Smart Farm Management System — AI-powered farm management for Somali farmers."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.6

  # UI
  google_fonts: ^6.2.1
  material_symbols_icons: ^4.2784.0
  intl: ^0.19.0

  # Media
  image_picker: ^1.1.2

  # Networking (weather — Open-Meteo, no API key)
  http: ^1.2.2
  # Pure-Dart decode/resize/encode — powers the client-side image-quality gate
  # and pre-upload compression for AI Plant Doctor. Works on web with no native
  # setup (unlike flutter_image_compress).
  image: ^4.2.0

  # Offline-first storage (Phase D). Pure Dart — IndexedDB on web, files on
  # mobile — so the same local cache works on every target with no native setup.
  hive_ce: ^2.7.0
  hive_ce_flutter: ^2.1.0

  # Utilities
  connectivity_plus: ^6.0.3

  # Reports (Phase F) — charts in-app, plus PDF/Excel export. All pure-Dart or
  # web-friendly so the same export path works on web and mobile.
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  excel: ^4.0.6
  file_saver: ^0.2.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Logo tooling — run once to (re)generate native launcher icons and splash.
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

# App launcher icon — generated from the brand sprout mark.
flutter_launcher_icons:
  image_path: "assets/logo/logo_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/logo/logo_icon.png"
    background_color: "#0D631B"
    theme_color: "#0D631B"

# Splash screen — white sprout on the brand green.
flutter_native_splash:
  color: "#0D631B"
  image: "assets/logo/logo_mark.png"
  android_12:
    color: "#0D631B"
    image: "assets/logo/logo_mark.png"
